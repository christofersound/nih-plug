name: Spectral Compressor macOS DMG

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Build macOS universal DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-dmg-${{ hashFiles('**/Cargo.lock') }}

      - name: Bundle VST3 and CLAP (universal)
        run: |
          export MACOSX_DEPLOYMENT_TARGET=10.13
          cargo xtask bundle-universal spectral_compressor --release
          echo "Archivos generados:"
          ls -la target/bundled

      - name: Ad-hoc sign the bundles
        run: |
          for b in "target/bundled/Spectral Compressor.vst3" "target/bundled/Spectral Compressor.clap"; do
            codesign --force --deep --sign - "$b"
          done

      - name: Create the DMG
        run: |
          VERSION=$(grep -m1 '^version' plugins/spectral_compressor/Cargo.toml | cut -d'"' -f2)
          STAGE=dmg_stage
          mkdir -p "$STAGE"
          cp -R "target/bundled/Spectral Compressor.vst3" "$STAGE/"
          cp -R "target/bundled/Spectral Compressor.clap" "$STAGE/"
          ln -s "/Library/Audio/Plug-Ins/VST3" "$STAGE/VST3 (arrastrar aqui)"
          ln -s "/Library/Audio/Plug-Ins/CLAP" "$STAGE/CLAP (arrastrar aqui)"
          cat > "$STAGE/LEEME.txt" <<'EOF'
          Copia "Spectral Compressor.vst3" a /Library/Audio/Plug-Ins/VST3
          Copia "Spectral Compressor.clap" a /Library/Audio/Plug-Ins/CLAP

          Si macOS dice que el plugin esta danado o no verificado, ejecuta en Terminal:
            xattr -cr "/Library/Audio/Plug-Ins/VST3/Spectral Compressor.vst3"
            xattr -cr "/Library/Audio/Plug-Ins/CLAP/Spectral Compressor.clap"
          EOF
          hdiutil create -volname "Spectral Compressor $VERSION" \
            -srcfolder "$STAGE" -ov -format UDZO \
            "SpectralCompressor-$VERSION-macOS-universal.dmg"
          echo "DMG_NAME=SpectralCompressor-$VERSION-macOS-universal.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: SpectralCompressor-macOS-dmg
          path: ${{ env.DMG_NAME }}

      - name: Attach DMG to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_NAME }}
